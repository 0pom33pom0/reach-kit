name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, security and consistency tests (no network)
        run: python -m unittest discover -s tests -t . -v
      - name: Build and install the wheel in a clean venv
        shell: bash
        run: |
          python -m pip install --quiet build==1.2.2
          python -m build --wheel
          python -m venv /tmp/v
          if [ -f /tmp/v/bin/python ]; then V=/tmp/v/bin; else V=/tmp/v/Scripts; fi
          $V/python -m pip install --quiet dist/*.whl
          $V/reach --version
          $V/reach install-skill --target /tmp/skill-test
          test -f /tmp/skill-test/SKILL.md
          test -f /tmp/skill-test/references/platforms.md
          $V/python -m pip list --format=freeze | grep -v -E '^(reach-kit|pip|setuptools)==' && { echo "unexpected dependency installed"; exit 1; } || true
