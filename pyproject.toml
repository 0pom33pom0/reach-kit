[project]
name = "reach-kit"
version = "1.0.0"
description = "Let AI agents read the web, social posts and their comments. Standard library only, no self-update, no stored cookies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "0pom33pom0"}]
keywords = ["ai-agent", "mcp", "claude-code", "skill", "youtube", "pantip", "comments", "web-reader"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
# Intentionally empty. A test enforces this — see SECURITY.md.
dependencies = []

[project.scripts]
reach = "reach.cli:main"

[project.urls]
Homepage = "https://github.com/0pom33pom0/reach-kit"
Issues = "https://github.com/0pom33pom0/reach-kit/issues"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach"]

[tool.hatch.build.targets.sdist]
include = ["reach", "tests", "README.md", "README_en.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]
